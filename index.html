<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone「加入主畫面」後以全螢幕 App 方式開啟 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Hunt">
<meta name="theme-color" content="#fffaf0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Food Hunt: Pixel Puzzle</title>
<style>
  :root { --ink: #5a3416; --cream: #fff7ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

    color: var(--ink); font-family: system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; overflow: hidden;
    background-color: #f6c48a;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.16) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.16) 75%),
      linear-gradient(45deg, rgba(255,255,255,.16) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.16) 75%);
    background-size: 44px 44px; background-position: 0 0, 22px 22px;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  /* 100vh 是舊版 Safari 的備案；padding 避開瀏海與底部 Home 指示條 */
  #app { max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; cursor: pointer; touch-action: manipulation; }
  button:active { transform: translateY(3px); }

  /* 上方列：重來｜Level｜2x */
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 14px 4px; padding-top: max(10px, env(safe-area-inset-top)); }
  .bar .title { font-size: 30px; font-weight: 900; letter-spacing: .5px; color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,.55); }
  .bar-left { justify-self: start; display: flex; gap: 8px; }
  .icon-btn { width: 46px; height: 46px; border-radius: 13px; border: 3px solid #6a32b8;
    background: #9b5de5; color: #fff; font-size: 24px; font-weight: 900; line-height: 1; box-shadow: 0 4px 0 #6a32b8;
  }
  .speed-btn {
    justify-self: end; height: 46px; padding: 0 12px; border-radius: 13px; border: 3px solid #8d8d9a;
    background: #d9d9e1; color: #fff; font-size: 21px; font-weight: 900; letter-spacing: -1px;
    text-shadow: 1px 0px 0 #6f6f7c, -1px 0px 0 #6f6f7c, 0px 1px 0 #6f6f7c, 0px -1px 0 #6f6f7c, 1px 1px 0 #6f6f7c, -1px 1px 0 #6f6f7c, 1px -1px 0 #6f6f7c, -1px -1px 0 #6f6f7c; box-shadow: 0 4px 0 #8d8d9a;
  }
  .speed-btn.on { background: #ffb02e; border-color: #d9822b; text-shadow: 1px 0px 0 #a85a10, -1px 0px 0 #a85a10, 0px 1px 0 #a85a10, 0px -1px 0 #a85a10, 1px 1px 0 #a85a10, -1px 1px 0 #a85a10, 1px -1px 0 #a85a10, -1px -1px 0 #a85a10; box-shadow: 0 4px 0 #d9822b; }
  .icon-btn:active, .speed-btn:active { box-shadow: 0 1px 0 #6a32b8; }

  canvas { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }

  /* 開始畫面 */
  .start {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    background: inherit;
  }
  .start.hidden { display: none; }
  .logo { font-size: 48px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 2px 0px 0 var(--ink), -2px 0px 0 var(--ink), 0px 2px 0 var(--ink), 0px -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 5px 0 var(--ink); }
  .sub { font-size: 16px; font-weight: 800; margin-top: -6px; }
  .app-icon { width: min(56vw, 230px); aspect-ratio: 1; border-radius: 22%; display: block; box-shadow: 0 6px 0 #d9975a, 0 10px 24px rgba(120,60,10,.25); }
  .start-btn {
    margin-top: 8px; padding: 14px 58px; border-radius: 18px; border: 4px solid #3f9a2c; background: #6fd34f;
    color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 3px; text-shadow: 2px 0px 0 #2f7a1f, -2px 0px 0 #2f7a1f, 0px 2px 0 #2f7a1f, 0px -2px 0 #2f7a1f, 2px 2px 0 #2f7a1f, -2px 2px 0 #2f7a1f, 2px -2px 0 #2f7a1f, -2px -2px 0 #2f7a1f, 0 3px 0 #2f7a1f; box-shadow: 0 6px 0 #3f9a2c;

  .start-btn:active { box-shadow: 0 2px 0 #3f9a2c; }

  /* 關卡選擇：只顯示關卡編號，不顯示題目圖 */
  .level-grid { display: grid; grid-template-columns: repeat(3, 92px); gap: 16px; margin: 6px 0 4px; }
  .level-card {
    height: 100px; border-radius: 18px; border: 4px solid #d9822b; background: #ffb02e; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 6px 0 #d9822b;
  }
  .level-card:active { box-shadow: 0 2px 0 #d9822b; }
  .level-card .num { font-size: 38px; font-weight: 900; line-height: 1;
    text-shadow: 2px 0 0 #a85a10, -2px 0 0 #a85a10, 0 2px 0 #a85a10, 0 -2px 0 #a85a10, 2px 2px 0 #a85a10, -2px 2px 0 #a85a10, 2px -2px 0 #a85a10, -2px -2px 0 #a85a10; }
  .level-card .state { font-size: 13px; font-weight: 800; color: #7a3f08; }
  .level-card.cleared { background: #6fd34f; border-color: #3f9a2c; box-shadow: 0 6px 0 #3f9a2c; }
  .level-card.cleared .state { color: #22621a; }
  .link-btn { margin-top: 10px; background: none; border: none; color: var(--ink); font-size: 17px; font-weight: 800; }

  /* 過關／失敗 */
  .overlay { position: fixed; inset: 0; z-index: 6; background: rgba(60,30,10,.45); display: grid; place-items: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .card { background: var(--cream); border-radius: 18px; box-shadow: 0 6px 0 #d9975a; padding: 22px 24px; text-align: center; min-width: 260px; }
  .card h2 { margin: 0 0 8px; font-size: 26px; font-weight: 900; }
  .card p { margin: 0 0 16px; color: #8a5a2e; }
  .card p:empty { display: none; }
  .card-actions { display: flex; gap: 10px; justify-content: center; }
  .card button { font-weight: 900; padding: 10px 18px; border-radius: 12px; border: 3px solid #3f9a2c; background: #6fd34f; color: #fff; box-shadow: 0 4px 0 #3f9a2c; }
  .card button.ghost { border-color: #c98a55; background: #fbe8cc; color: var(--ink); box-shadow: 0 4px 0 #c98a55; }
</style>

<div id="app">
  <div class="bar">
    <div class="bar-left">
      <button id="backBtn" class="icon-btn" aria-label="選擇關卡">◀</button>
      <button id="restartBtn" class="icon-btn" aria-label="重來">↻</button>
    </div>
    <div class="title" id="levelTitle">Level 1</div>
    <button id="speedBtn" class="speed-btn" aria-label="2 倍速">▶▶2x</button>
  </div>
  <canvas id="cv"></canvas>
</div>

<div class="start" id="startScreen">
  <div class="logo">Food Hunt</div>
  <div class="sub">Pixel Puzzle・螞蟻搬方塊</div>
  <img class="app-icon" src="icon.png" alt="">
  <button class="start-btn" id="startBtn">START</button>
</div>

<div class="start hidden" id="levelScreen">
  <div class="logo">選擇關卡</div>
  <div class="level-grid" id="levelGrid"></div>
  <button class="link-btn" id="levelBack">◀ 回首頁</button>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h2 id="ovTitle"></h2><p id="ovText"></p>
    <div class="card-actions"><button class="ghost" id="ovHome">選擇關卡</button><button id="ovBtn">再玩一次</button></div>
  </div>
</div>

// 2. 關卡工具：計數、驗證、自動產生螞蟻盒
// =====================================================================
const EMPTY = null;

function parseGrid(grid) {
  const R = grid.length, C = grid[0].length;
  const cells = new Array(R * C);
  for (let r = 0; r < R; r++)
    for (let c = 0; c < C; c++) {
      const ch = grid[r][c];
      cells[r * C + c] = ch === '.' ? EMPTY : ch;
    }
  return { R, C, cells };
}

function countColors(cells) {
  const counts = {};
  for (const v of cells) if (v !== EMPTY) counts[v] = (counts[v] || 0) + 1;
  return counts;
}

function validateLevel(level) {
  const errors = [];
  const { C } = parseGrid(level.grid);
  level.grid.forEach((row, r) => { if (row.length !== C) errors.push(`第 ${r} 列長度 ${row.length} ≠ ${C}`); });
  const counts = countColors(parseGrid(level.grid).cells);
  const boxSum = {};
  for (const b of level.lanes.flat()) {
    if (!level.palette[b.color]) errors.push(`螞蟻盒顏色 ${b.color} 不在色盤中`);
    boxSum[b.color] = (boxSum[b.color] || 0) + b.count;
  }
  for (const k of new Set([...Object.keys(counts), ...Object.keys(boxSum)]))
    if ((counts[k] || 0) !== (boxSum[k] || 0)) errors.push(`顏色 ${k}：方格 ${counts[k] || 0} 格，螞蟻盒共 ${boxSum[k] || 0}`);
  return errors;
}

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * 從像素陣列自動產生螞蟻盒：每盒 min~max 格（maxByColor 可以替個別顏色設定不同上限）。
 * 做法是模擬遊戲：每一輪重新計算可達格，挑一個「露出格數夠多」的顏色，
 * 盒子大小不超過目前露出的格數，然後照螞蟻的順序（近的先吃）把那些格子吃掉。
 *
 * 難度（陷阱盒）：每一輪有 trapRate 的機率，挑一個「幾乎還埋在中間」的顏色（露出不到 min/2 格）
 * 先排進佇列，但在模擬裡要等到它真的吃得完才執行。玩家太早點它，隊伍就會卡在暫存格；
 * 同時最多 trapMax 個陷阱在等待，所以全部卡滿暫存格就會輸。
 *
 * 回傳的陣列另外帶一個 solution 屬性：一種保證能過關的點選順序（佇列 index），測試用。
 */
function generateBoxes(grid, { min = 10, max = 50, maxByColor = {}, seed = 1, trapRate = 0.12, trapMax = 5 } = {}) {
  const maxOf = (k) => maxByColor[k] ?? max;
  const rand = mulberry32(seed);
  const { R, C, cells } = parseGrid(grid);
  const work = cells.slice();
  const free = countColors(work); // 還沒分配給任何盒子的格數
  let unassigned = Object.values(free).reduce((a, b) => a + b, 0);
  const boxes = [];
  const solution = [];
  const pending = []; // 已排進佇列、還在等的陷阱盒 index

  const exposedByColor = (w) => {
    const by = {};
    for (const [i, e] of Rules.computeReach(w, R, C).exposed) (by[w[i]] ??= []).push([i, e.d]);
    // 跟遊戲裡螞蟻挑目標的順序一樣：路徑短的先、靠下面的先
    for (const k in by) by[k].sort((a, b) => a[1] - b[1] || b[0] - a[0]);
    return by;
  };
  // 一隊螞蟻吃 n 格（邊吃邊打通路）；吃不完回傳 false
  const eat = (w, color, n) => {
    while (n > 0) {
      const list = exposedByColor(w)[color];
      if (!list) return false;
      const k = Math.min(n, list.length);
      for (let j = 0; j < k; j++) w[list[j][0]] = EMPTY;
      n -= k;
    }
    return true;
  };

  while (unassigned > 0 || pending.length) {
    // 1. 等待中的陷阱：現在派出吃得完就執行
    const ready = pending.findIndex((q) => eat(work.slice(), boxes[q].color, boxes[q].count));
    if (ready >= 0) {
      const q = pending.splice(ready, 1)[0];
      eat(work, boxes[q].color, boxes[q].count);
      solution.push(q);
      continue;
    }
    const byColor = exposedByColor(work);
    const exposedFree = (k) => Math.min(byColor[k]?.length || 0, free[k]);

    // 2. 放一個陷阱：挑大部分還埋著的顏色
    if (pending.length < trapMax && rand() < trapRate) {
      const cands = Object.keys(free).filter((k) => free[k] >= min && exposedFree(k) * 2 < min);
      if (cands.length) {
        const color = cands[Math.floor(rand() * cands.length)];
        let size = min + Math.floor(rand() * (Math.min(maxOf(color), free[color]) - min + 1));
        const rest = free[color] - size;
        if (rest > 0 && rest < min) size = free[color] <= maxOf(color) ? free[color] : free[color] - min;
        boxes.push({ color, count: size });
        pending.push(boxes.length - 1);
        free[color] -= size;
        unassigned -= size;
        continue;
      }
    }

    // 3. 一般盒：這個顏色現在最多能裝幾格（不超過露出的格數，也不留下不到一盒的零頭）
    const maxSize = (k) => {
      const avail = exposedFree(k), rem = free[k];
      if (rem <= Math.min(maxOf(k), avail)) return rem;
      const size = Math.min(maxOf(k), avail, rem - min);
      return size >= min ? size : 0;
    };
    let options = Object.keys(byColor).map((k) => [k, maxSize(k)]).filter(([, m]) => m > 0);
    if (!options.length) { // 沒有顏色湊得滿一盒，只好出小盒
      options = Object.keys(byColor).map((k) => [k, exposedFree(k)]).filter(([, m]) => m > 0);
      if (!options.length) return generateBoxes(grid, { min, max, maxByColor, seed: seed + 1000, trapRate, trapMax }); // 陷阱互相卡死，換一組
    }
    // 露出越多的顏色越容易被選到，盒子比較大
    let pick = rand() * options.reduce((t, [, m]) => t + m, 0), color, cap;
    for ([color, cap] of options) if ((pick -= cap) <= 0) break;
    const size = cap === free[color] || cap <= min ? cap : min + Math.floor((1 - rand() * rand()) * (cap - min + 1)); // 偏向大盒
    eat(work, color, size);
    free[color] -= size;
    unassigned -= size;
    boxes.push({ color, count: size });
    solution.push(boxes.length - 1);
  }
  // 不到 min 的小盒：併進同色、點選順序上最接近的下一盒（沒有的話就併進前一盒）
  const turn = new Map(solution.map((p, t) => [p, t]));
  for (const p of solution) {
    const b = boxes[p];
    if (b.count === 0 || b.count >= min) continue;
    const same = solution.filter((q) => q !== p && boxes[q].color === b.color && boxes[q].count > 0);
    if (!same.length) continue; // 這個顏色總數本來就不到 min
    const q = same.find((x) => turn.get(x) > turn.get(p)) ?? same[same.length - 1];
    boxes[q].count += b.count;
    b.count = 0;
  }
  const kept = boxes.map((b, i) => i).filter((i) => boxes[i].count > 0);
  const renumber = new Map(kept.map((i, k) => [i, k]));
  const result = kept.map((i) => boxes[i]);
  result.solution = solution.filter((p) => renumber.has(p)).map((p) => renumber.get(p));
  return result;
}

/**
 * 把 generateBoxes() 的盒子分成 laneCount 行。
 * 依照「保證過關的點選順序」一盒一盒放：每盒放進某一行的最後面，所以輪到它的時候一定在那一行最上面。
 * 一般盒子大約提前 laneCount-1 次點擊出現在最上面；陷阱盒則盡量在它排進佇列時就出現（很早就擺在上面誘惑玩家）。
 * 回傳的陣列另外帶一個 solution 屬性：保證過關時每次要點哪一行，測試用。
 */
function boxesToLanes(boxes, laneCount = LANE_COUNT) {
  const lanes = Array.from({ length: laneCount }, () => []);
  const lastTap = new Array(laneCount).fill(-1); // 這一行上一盒被點走是第幾次點擊
  const solution = [];
  boxes.solution.forEach((p, t) => {
    const appear = Math.min(p, t - (laneCount - 1)); // 希望它從第幾次點擊開始出現在最上面
    let best = -1;
    for (let l = 0; l < laneCount; l++)
      if (lastTap[l] <= appear && (best < 0 || lastTap[l] > lastTap[best])) best = l;
    if (best < 0) best = lastTap.indexOf(Math.min(...lastTap));
    lanes[best].push({ color: boxes[p].color, count: boxes[p].count });
    lastTap[best] = t;
    solution.push(best);
  });
  lanes.solution = solution;
  return lanes;
}

// =====================================================================
// 3. 規則（純邏輯，不碰畫面）
// =====================================================================
const SLOT_COUNT = 5;        // 暫存格數量
const HOLE_DY = 6;           // 螞蟻洞在版面下方幾格的位置（版面座標）
const LANE_COUNT = 5;        // 螞蟻盒分成幾行（每行只能點最上面那盒）
const LANE_ROWS = 3;         // 每行畫出幾盒
const ANT_SPEED = 36;        // 螞蟻速度（格/秒）
const DISPATCH_GAP = 0.06;   // 同一隊每一波的間隔（秒）
const ANTS_PER_WAVE = 3;     // 每一波同時派出幾隻

const Rules = {
  neighbors(i, R, C) {
    const r = Math.floor(i / C), c = i % C, out = [];
    if (r > 0) out.push(i - C);
    if (r < R - 1) out.push(i + C);
    if (c > 0) out.push(i - 1);
    if (c < C - 1) out.push(i + 1);
    return out;
  },
  isBorder(i, R, C) {
    const r = Math.floor(i / C), c = i % C;
    return r === 0 || c === 0 || r === R - 1 || c === C - 1;
  },

  /**
   * 可達性：從版面外圍經由空白格 BFS。
   * 回傳 parent（空白格回到外面的上一步，-1 = 直接從外面進來）、
   * exposed: Map<彩色格 index, {via, d}>  via = 從哪個空白格吃（-1 = 從外面直接吃），d = 路徑長
   */
  computeReach(cells, R, C) {
    const n = R * C;
    const dist = new Int32Array(n).fill(-1);
    const parent = new Int32Array(n).fill(-2);
    const queue = [];
    for (let i = 0; i < n; i++)
      if (cells[i] === EMPTY && Rules.isBorder(i, R, C)) { dist[i] = 0; parent[i] = -1; queue.push(i); }
    for (let h = 0; h < queue.length; h++) {
      const i = queue[h];
      for (const j of Rules.neighbors(i, R, C))
        if (cells[j] === EMPTY && dist[j] < 0) { dist[j] = dist[i] + 1; parent[j] = i; queue.push(j); }
    }
    const exposed = new Map();
    for (let i = 0; i < n; i++) {
      if (cells[i] === EMPTY) continue;
      let best = Rules.isBorder(i, R, C) ? { via: -1, d: 0 } : null;
      for (const j of Rules.neighbors(i, R, C))
        if (dist[j] >= 0 && (!best || dist[j] + 1 < best.d)) best = { via: j, d: dist[j] + 1 };
      if (best) exposed.set(i, best);
    }
    return { dist, parent, exposed };
  },

  // 從外面走到目標格的格子序列（最後一格是目標本身）
  cellPath(reach, target) {
    const path = [target];
    let p = reach.exposed.get(target).via;
    while (p >= 0) { path.push(p); p = reach.parent[p]; }
    return path.reverse();
  },
};

function createGame(level) {
  const { R, C, cells } = parseGrid(level.grid);
  const s = {
    R, C, cells,
    palette: level.palette,
    left: cells.filter((v) => v !== EMPTY).length,
    lanes: level.lanes.map((lane) => lane.map((b) => ({ color: b.color, count: b.count }))),
    slots: new Array(SLOT_COUNT).fill(null),
    ants: [],
    reserved: new Set(),
    reach: null,
    dirty: true,
    status: 'playing', // playing | won | lost
    time: 0,
  };

  const ensureReach = () => {
    if (s.dirty) { s.reach = Rules.computeReach(s.cells, R, C); s.dirty = false; }
    return s.reach;
  };

  // 找最近、未被預定的同色可達格；靠近底部的優先
  function findTarget(color) {
    const reach = ensureReach();
    let best = -1, bd = Infinity;
    for (const [i, e] of reach.exposed) {
      if (s.cells[i] !== color || s.reserved.has(i)) continue;
      const score = e.d * 100 - Math.floor(i / C);
      if (score < bd) { bd = score; best = i; }
    }
    return best;
  }

  // 螞蟻路線（版面座標，單位 = 格）：洞口 → 版面外緣 → 沿外圍 → 入口 → 空白格 → 目標；回程原路返回
  function antRoute(target) {
    const reach = ensureReach();
    const cellsOnPath = Rules.cellPath(reach, target);
    const first = cellsOnPath[0];
    const fr = Math.floor(first / C), fc = first % C;
    const sx = C / 2;
    const pts = [[sx, R + HOLE_DY], [sx, R + 0.5]];
    const L = -0.5, Rt = C + 0.5, T = -0.5, Bt = R + 0.5;
    if (fr === R - 1) pts.push([fc + 0.5, Bt]);
    else if (fc === 0) pts.push([L, Bt], [L, fr + 0.5]);
    else if (fc === C - 1) pts.push([Rt, Bt], [Rt, fr + 0.5]);
    else if (sx + fc < 2 * C - sx - fc) pts.push([L, Bt], [L, T], [fc + 0.5, T]);
    else pts.push([Rt, Bt], [Rt, T], [fc + 0.5, T]);
    for (const i of cellsOnPath) pts.push([(i % C) + 0.5, Math.floor(i / C) + 0.5]);
    const seg = [0];
    for (let k = 1; k < pts.length; k++) seg.push(seg[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
    return { pts, seg, length: seg[seg.length - 1] };
  }

  const api = {
    state: s,
    canTap(l) { return s.status === 'playing' && s.lanes[l]?.length > 0 && s.slots.includes(null); },

    // 點某一行最上面的螞蟻盒 → 進入暫存格，下面的盒子往上遞補
    tapBox(l) {
      if (!api.canTap(l)) return false;
      const box = s.lanes[l].shift();
      const slot = s.slots.indexOf(null);
      s.slots[slot] = { ...box, total: box.count, dispatched: 0, eaten: 0, cooldown: 0, waiting: false };
      return true;
    },

    step(dt) {
      if (s.status !== 'playing') return;
      s.time += dt;

      // 派出螞蟻
      s.slots.forEach((team, k) => {
        if (!team || team.dispatched >= team.total) { if (team) team.waiting = false; return; }
        team.cooldown -= dt;
        if (team.cooldown > 0) return;
        // 每一波同時派出多隻，各自去不同的目標格
        let sent = 0;
        while (sent < ANTS_PER_WAVE && team.dispatched < team.total) {
          const target = findTarget(team.color);
          if (target < 0) break;
          s.reserved.add(target);
          s.ants.push({ team, slot: k, target, color: team.color, route: antRoute(target), d: 0, picked: false });
          team.dispatched++;
          sent++;
        }
        team.waiting = sent === 0;
        if (sent > 0) team.cooldown = DISPATCH_GAP;
      });

      // 螞蟻前進：走到目標就把方塊搬起來（方塊離開版面），再原路搬回洞裡
      for (let a = s.ants.length - 1; a >= 0; a--) {
        const ant = s.ants[a];
        ant.d += ANT_SPEED * dt;
        if (!ant.picked && ant.d >= ant.route.length) {
          ant.picked = true;
          s.cells[ant.target] = EMPTY;
          s.reserved.delete(ant.target);
          s.left--;
          s.dirty = true;
          const team = ant.team;
          team.eaten++;
          if (team.eaten === team.total) s.slots[ant.slot] = null; // 全部搬完，隊伍離開
        }
        if (ant.d >= ant.route.length * 2) s.ants.splice(a, 1); // 回到洞裡
      }

      api.updateStatus();
    },

    updateStatus() {
      if (s.left === 0 && s.ants.length === 0) { s.status = 'won'; return; }
      if (s.ants.some((a) => !a.picked)) return; // 還有螞蟻在去搬的路上
      const teams = s.slots.filter(Boolean);
      const allStuck = teams.every((t) => findTarget(t.color) < 0);
      const full = teams.length === SLOT_COUNT;
      const noMoreBoxes = s.lanes.every((lane) => lane.length === 0);
      if (allStuck && (full || noMoreBoxes) && s.left > 0) s.status = 'lost';
    },
  };
  return api;
}

// =====================================================================
// 4. 畫面繪製（只讀取 state，不改規則）
// =====================================================================
function createRenderer(canvas) {
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, L = null;
  // 版面先畫在離屏圖層，之後只重畫被搬走的格子（80×80 每幀全畫太慢）
  const layer = document.createElement('canvas');
  const lctx = layer.getContext('2d');
  let shown = null; // 圖層上目前畫的格子內容，用來跟 state.cells 比對

  function resize(game) {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { R, C } = game.state;
    const pad = 14, fp = 10, gap = 8;                         // fp = 版面外框寬度
    const box = Math.floor(Math.min(60, (W - pad * 2 - gap * 4) / 5)); // 螞蟻盒邊長
    const depth = Math.round(box * 0.14);                     // 螞蟻盒的立體厚度
    const slot = Math.floor(box * 0.92);
    const queueRows = LANE_ROWS;
    const queueH = queueRows * (box + depth + gap) + 18;
    const fixedBelow = 24 + slot + 20 + queueH;               // 洞口以下的高度
    // 80×80 格子很小，允許非整數格寬，繪製時再對齊像素
    const cell = Math.max(2, Math.min((W - pad * 2 - fp * 2) / C, (H - pad - fp - fixedBelow) / (R + HOLE_DY)));
    const contentH = fp + cell * (R + HOLE_DY) + fixedBelow;
    const by = pad + fp + Math.max(0, (H - pad - contentH) / 3); // 螢幕較高時整體稍微往下移
    const bx = (W - cell * C) / 2;
    const holeY = by + cell * (R + HOLE_DY);
    const slotTop = holeY + 24;
    const queueTop = slotTop + slot + 20;
    L = { cell, bx, by, fp, box, depth, slot, gap, holeX: bx + (cell * C) / 2, holeY, slotTop, queueTop };
    layer.width = canvas.width; layer.height = canvas.height;
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    shown = null;
  }

  // ---- 顏色工具 ----
  const shadeCache = {};
  const mix = (hex, to, k) => {
    const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
    const ch = (sh) => Math.round(((a >> sh) & 255) * (1 - k) + ((b >> sh) & 255) * k);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  };
  const shades = (hex) => (shadeCache[hex] ??= { hi: mix(hex, '#ffffff', 0.4), lo: mix(hex, '#000000', 0.32) });

  // 立體方塊：左上亮邊、右下暗邊、中間正面
  function drawBlock(g, x, y, w, h, hex) {
    const { hi, lo } = shades(hex);
    const b = Math.max(1, Math.round(Math.min(w, h) * 0.16));
    g.fillStyle = lo; g.fillRect(x, y, w, h);
    g.fillStyle = hi; g.fillRect(x, y, w - b, h - b);
    g.fillStyle = hex; g.fillRect(x + b, y + b, w - 2 * b, h - 2 * b);
  }

  // 第 n 條格線的螢幕座標（四捨五入避免格子之間出現細縫）
  const gx = (c) => Math.round(L.bx + c * L.cell);
  const gy = (r) => Math.round(L.by + r * L.cell);

  function drawLayerCell(s, i) {
    const C = s.C, r = Math.floor(i / C), c = i % C, v = s.cells[i];
    const x = gx(c), y = gy(r), w = gx(c + 1) - x, h = gy(r + 1) - y;
    if (v === EMPTY) {
      lctx.fillStyle = '#fbe8cc'; // 跟外框同色，搬走後看起來就是空的
      lctx.fillRect(x, y, w, h);
    } else {
      drawBlock(lctx, x, y, w, h, s.palette[v]);
    }
  }

  function syncLayer(s) {
    if (!shown) {
      lctx.clearRect(0, 0, W, H);
      for (let i = 0; i < s.cells.length; i++) drawLayerCell(s, i);
      shown = s.cells.slice();
      return;
    }
    for (let i = 0; i < s.cells.length; i++)
      if (s.cells[i] !== shown[i]) { drawLayerCell(s, i); shown[i] = s.cells[i]; }
  }

  const roundRect = (x, y, w, h, r) => {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    // iOS 16 以前的 Safari 沒有 roundRect
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };

  // ---- 版面外框與螞蟻洞 ----
  function drawFrame(s) {
    const { bx, by, cell, fp } = L, w = cell * s.C + fp * 2, h = cell * s.R + fp * 2;
    roundRect(bx - fp, by - fp + 5, w, h, 16); ctx.fillStyle = '#d9975a'; ctx.fill();
    roundRect(bx - fp, by - fp, w, h, 16); ctx.fillStyle = '#fbe8cc'; ctx.fill();
    ctx.strokeStyle = '#f0cfa2'; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawHole() {
    const { holeX: x, holeY: y } = L, rx = 32, ry = 12;
    // 洞旁邊的蓋子
    ctx.beginPath(); ctx.ellipse(x + rx * 1.15, y + 2, rx * 0.8, ry * 1.05, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#c98a55'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + rx * 1.15, y, rx * 0.8, ry * 1.05, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e2a874'; ctx.fill(); ctx.strokeStyle = '#c98a55'; ctx.lineWidth = 1.5; ctx.stroke();
    // 洞口
    const g = ctx.createRadialGradient(x, y + 2, 2, x, y, rx);
    g.addColorStop(0, '#1f0f06'); g.addColorStop(0.75, '#3b200e'); g.addColorStop(1, '#7a4a25');
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
  }

  // ---- 螞蟻 ----
  // 螞蟻在路線上的位置與朝向；超過路線長度就是回程（原路返回、頭朝洞口）
  function antPose(ant) {
    const { pts, seg, length } = ant.route;
    let d = ant.d, back = false;
    if (d > length) { d = Math.max(0, 2 * length - d); back = true; }
    let k = 1;
    while (k < seg.length - 1 && seg[k] < d) k++;
    const t = Math.min(1, (d - seg[k - 1]) / (seg[k] - seg[k - 1] || 1));
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
    return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, a: Math.atan2(y1 - y0, x1 - x0) + (back ? Math.PI : 0) };
  }

  // color = 這隻螞蟻的隊伍顏色；carrying = 是否正搬著方塊回洞
  function drawAnt(x, y, a, size, color, carrying, phase, now) {
    const { lo } = shades(color);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    // 腳：三對，走路時前後擺動
    const swing = Math.sin(now * 0.02 + phase) * size * 0.09;
    ctx.strokeStyle = lo;
    ctx.lineWidth = Math.max(0.8, size * 0.07);
    ctx.beginPath();
    [[0.1, 1], [0, -1], [-0.1, 1]].forEach(([lx, dir]) => {
      const sw = swing * dir;
      ctx.moveTo(lx * size, 0); ctx.lineTo(lx * size + sw + size * 0.04, -size * 0.3);
      ctx.moveTo(lx * size, 0); ctx.lineTo(lx * size - sw + size * 0.04, size * 0.3);
    });
    ctx.stroke();
    // 身體：腹部、胸部、頭（隊伍顏色，深色描邊讓淺色螞蟻也看得清楚）
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(0.8, size * 0.05);
    for (const [ex, rx, ry] of [[-0.27, 0.22, 0.16], [0, 0.12, 0.09], [0.21, 0.11, 0.1]]) {
      ctx.beginPath(); ctx.ellipse(size * ex, 0, size * rx, size * ry, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    // 眼睛
    ctx.fillStyle = lo;
    ctx.beginPath(); ctx.arc(size * 0.25, -size * 0.045, size * 0.025, 0, Math.PI * 2); ctx.arc(size * 0.25, size * 0.045, size * 0.025, 0, Math.PI * 2); ctx.fill();
    // 搬著的方塊（咬在頭前面）
    if (carrying) {
      const b = Math.max(3, L.cell * 1.1);
      drawBlock(ctx, size * 0.3, -b / 2, b, b, color);
    }
    ctx.restore();
  }

  // ---- 暫存格與螞蟻盒 ----
  // 立體按鍵：底下一層暗色當厚度，上面是正面，數字白字描邊
  // 很淺的顏色（白、淺粉）要加深邊框和數字描邊，不然看不清楚、也會跟空的暫存格混淆
  const isLight = (hex) => {
    const n = parseInt(hex.slice(1), 16);

    const { lo } = shades(hex), face = h - depth, r = Math.min(12, w * 0.2);

    if (light) { ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.stroke(); }
    roundRect(x + 4, y + 3, w - 8, face * 0.3, r * 0.6); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
    ctx.font = `900 ${Math.round(face * 0.44)}px system-ui, -apple-system, sans-serif`;
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2.5, face * 0.1);
    ctx.strokeStyle = ink;
    ctx.strokeText(label, x + w / 2, y + face / 2 + 1);

  function slotRect(k) {
    const left = (W - (SLOT_COUNT * L.slot + (SLOT_COUNT - 1) * L.gap)) / 2;

  }
  // 第 lane 行、第 row 盒（0 = 最上面）；shift = 往上遞補動畫還差多少像素
  const rowH = () => L.box + L.depth + L.gap;
  function boxRect(lane, row, shift = 0) {
    const left = (W - (LANE_COUNT * L.box + (LANE_COUNT - 1) * L.gap)) / 2;
    return [left + lane * (L.box + L.gap), L.queueTop + row * rowH() + shift, L.box, L.box + L.depth];
  }

  // 往上遞補的動畫：某一行變短時，整行先停在原位，再滑上來
  const slide = new Array(LANE_COUNT).fill(0);
  let laneLens = null, lanesRef = null, lastNow = 0;
  function updateSlide(s, now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000);

    if (lanesRef !== s.lanes) { lanesRef = s.lanes; laneLens = s.lanes.map((l) => l.length); slide.fill(0); }
    s.lanes.forEach((lane, l) => {
      if (lane.length < laneLens[l]) slide[l] += (laneLens[l] - lane.length) * rowH();

      slide[l] = Math.max(0, slide[l] - Math.max(rowH() * 6, slide[l] * 12) * dt);

  function draw(game) {
    const s = game.state, { cell, bx, by } = L;
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    drawFrame(s);
    syncLayer(s);
    ctx.drawImage(layer, 0, 0, W, H);
    drawHole();

    // 螞蟻
    const antSize = Math.max(12, cell * 2.2);
    for (const ant of s.ants) {
      const p = antPose(ant);

    }

    // 螞蟻盒：每行最上面那盒可以點，下面的盒子往上遞補
    updateSlide(s, now);

    s.lanes.forEach((lane, l) => {
      const extra = Math.ceil(slide[l] / rowH()); // 滑動中多畫幾盒，讓下面的盒子從底下滑進來
      for (let row = 0; row < Math.min(lane.length, LANE_ROWS + extra); row++) {
        const [x, y, w, h] = boxRect(l, row, slide[l]);
        drawKey(x, y, w, h, L.depth, s.palette[lane[row].color], lane[row].count);

    });

  // 點到哪一行最上面的盒子（回傳行號，沒點到回傳 -1）
  function hitQueue(x, y, game) {
    for (let l = 0; l < LANE_COUNT; l++) {
      if (!game.state.lanes[l].length) continue;
      const [bx, by, w, h] = boxRect(l, 0);
      if (x >= bx && x <= bx + w && y >= by && y <= by + h) return l;
    }
    return -1;
  }

  return { resize, draw, hitQueue };

const LEVELS = [LEVEL_1, LEVEL_2, LEVEL_3];

const canvas = document.getElementById('cv');
const renderer = createRenderer(canvas);
let game = null;
let current = 0; // 目前關卡（LEVELS 的 index）
let speed = 1;
let shownStatus = 'playing';
const $ = (id) => document.getElementById(id);

// 過關紀錄只存在這支手機的瀏覽器
const CLEARED_KEY = 'foodhunt-cleared';
const loadCleared = () => { try { return new Set(JSON.parse(localStorage.getItem(CLEARED_KEY)) || []); } catch { return new Set(); } };
const saveCleared = (set) => { try { localStorage.setItem(CLEARED_KEY, JSON.stringify([...set])); } catch {} };

function showScreen(id) {
  for (const s of ['startScreen', 'levelScreen']) $(s).classList.toggle('hidden', s !== id);
  $('overlay').classList.add('hidden');
}

function showStart() { game = null; showScreen('startScreen'); }

function showLevels() {
  game = null;
  const cleared = loadCleared();
  $('levelGrid').innerHTML = '';
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'level-card' + (cleared.has(i) ? ' cleared' : '');
    b.innerHTML = `<span class="num">${i + 1}</span><span class="state">${cleared.has(i) ? '✓ 已過關' : 'Level ' + (i + 1)}</span>`;
    b.onclick = () => start(i);
    $('levelGrid').appendChild(b);
  });
  showScreen('levelScreen');
}

function start(i = current) {
  current = i;
  const level = LEVELS[i];
  const errors = validateLevel(level);
  if (errors.length) { showOverlay('關卡資料錯誤', errors.join('\n')); console.error(errors); return; }
  game = createGame(level);
  shownStatus = 'playing';
  $('levelTitle').textContent = `Level ${i + 1}`;
  showScreen(null);
  renderer.resize(game);
}

// 過關／失敗視窗：右邊按鈕在過關時變成「下一關」
let ovAction = start;
function showOverlay(title, text, next) {
  $('ovTitle').textContent = title;
  $('ovText').textContent = text;
  $('ovBtn').textContent = next ? '下一關' : '再玩一次';
  ovAction = next ? () => start(current + 1) : () => start(current);
  $('overlay').classList.remove('hidden');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (game) {
    game.step(dt * speed);
    renderer.draw(game);
    const st = game.state.status;
    if (st !== shownStatus) {
      shownStatus = st;
      if (st === 'won') {
        const cleared = loadCleared(); cleared.add(current); saveCleared(cleared);
        showOverlay('過關！🐜', '', current + 1 < LEVELS.length);
      }
      if (st === 'lost') showOverlay('失敗', '暫存格滿了，而且沒有隊伍搬得到方塊');
    }
  }
  requestAnimationFrame(frame);
}

canvas.addEventListener('pointerdown', (e) => {
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  const q = renderer.hitQueue(e.clientX - rect.left, e.clientY - rect.top, game);
  if (q >= 0) game.tapBox(q);
});
$('speedBtn').onclick = () => {
  speed = speed === 1 ? 2 : 1;
  $('speedBtn').classList.toggle('on', speed === 2);
};
$('startBtn').onclick = showLevels;
$('levelBack').onclick = showStart;
$('backBtn').onclick = showLevels;
$('restartBtn').onclick = () => start(current);
$('ovBtn').onclick = () => ovAction();
$('ovHome').onclick = showLevels;
const onResize = () => game && renderer.resize(game);
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 300)); // iPhone 轉向後尺寸會晚一點才更新
window.visualViewport?.addEventListener('resize', onResize); // Safari 網址列收合時

requestAnimationFrame(frame);
</script>
